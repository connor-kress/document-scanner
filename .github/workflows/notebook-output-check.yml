name: Notebook output check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check-notebook-outputs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject committed notebook outputs
        run: python scripts/clean_notebooks.py
